- titleid: ELICRY002
  name: Crystal Archiver
  version: v1.1
  author: Eli Crystal
  type: utility
  description: 'CrystalArchiver is a one click mass archiver for PSM licenses that does not require launching each PSM game. This project was created for the PSM Yaroze project which aims to save not only PSM history, but Sony and indie developer history.

    Each license is backed up by calling the original DRM functions used by the original PSM Application and then creating a depersonalized key in FAKE.RIF format used by NoPSMDRM. A depersonalized key allows a backup to be decrypted and to be played without PSM activation, provided you have the original PSM files. Because it is not tied to any one user, it does not contain personalized information. This can allow you play your PSM titles on another Vita you may own, even if you did not activate or download them before PSM closure. You can even play it on a Windows PC. Please note that this tool is used for creating backups and we would like you not to use it for anything that may hurt developers. Many PSM titles were ported to other systems where you can continue to support them.

    After running CrystalArchiver, these license backups will be found at ux0:/data/psm.'
  date: '2024-08-10'
  url: https://github.com/EliCrystal2001/CrystalArchiver/releases/download/v1.1/CrystalArchiver.vpk
  icon: ELICRY002.png
- titleid: ELICRY001
  name: Crystal PSM
